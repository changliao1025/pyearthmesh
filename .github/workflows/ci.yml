name: CI Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pyearthmesh-test
          init-shell: bash
          condarc: |
            channels:
              - conda-forge
              - nodefaults
          create-args: >-
            python=${{ matrix.python-version }}
            numpy
            gdal
            netcdf4
            shapely
            cartopy
            pyearth
            pytest
            pytest-cov
            pip
          cache-environment: true
          cache-environment-key: micromamba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install package and test dependencies
        shell: bash -el {0}
        run: python -m pip install -e ".[viz,dev]"

      - name: Run test suite
        shell: bash -el {0}
        run: python -m pytest -ra --cov=pyearthmesh --cov-report=xml tests/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
