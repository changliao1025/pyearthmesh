name: Upload pyearthmesh Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "Package version: $PACKAGE_VERSION"
          echo "Release tag version: $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Package: $PACKAGE_VERSION, tag: $TAG_VERSION"
            exit 1
          fi

      - name: Build package distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyearthmesh-dist
          path: dist/
          retention-days: 7

      - name: Publish pre-release to TestPyPI
        if: github.event_name == 'release' && github.event.release.prerelease
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST }}
        run: python -m twine upload --repository testpypi dist/*

      - name: Publish release to PyPI
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYEARTHMESH_PYPI }}
        run: python -m twine upload dist/*
